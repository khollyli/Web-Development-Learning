<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: grid;
      /* grid-template: 414px 295px 20px / 320px 401px; */
      grid-template: 414px 130px 155px 20px / 320px 198px 153px 50px;
      max-width: 748px;
      gap: 9px;
      background-color: black;
    }

    .red-box {
      background-color: #E72F24;
    }

    .white-box {
      background-color: #F0F1EC;
    }

    .blue-box {
      background-color: #004592;
      border-bottom: 10px solid black;
    }

    .yellow-box {
      background-color: #F9D01E;
      grid-area: -2 / 2 / -1 / 3;
    }

    .black-box {
      background-color: #232629;
      grid-area: -2 / 3 / -1 / -2;
      
    }

    .one {
      grid-column: span 3;
    }

    .two {
      grid-row: span 2;
    }

    .three {
      grid-row: span 2;
      grid-column: span 2;
    }

    .four {
      grid-row: span 2;
    }
    
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="container">
    <div class="red-box"></div>
    <div class="white-box one"></div>
    <div class="white-box two"></div>
    <div class="white-box three"></div>
    <div class="blue-box"></div>
    <div class="white-box four"></div>
    <div class="yellow-box"></div>
    <div class="black-box"></div>
    <div class="white-box five"></div>
   </div>
</body>

</html>
